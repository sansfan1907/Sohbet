<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#008069">
<title>Sohbet</title>
<style>
:root{--bg:#fff;--fg:#111b21;--mut:#667781;--bar:#008069;--acc:#25d366;--line:#e9edef;--me:#d9fdd3;--them:#fff;--chat:#efeae2}
@media (prefers-color-scheme:dark){:root{--bg:#111b21;--fg:#e9edef;--mut:#8696a0;--bar:#202c33;--line:#222d34;--me:#005c4b;--them:#202c33;--chat:#0b141a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}
header{background:var(--bar);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:56px}
header h1{font-size:20px;margin:0;flex:1;font-weight:600}
header .t{flex:1;font-weight:600}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ib{font-size:20px;padding:6px 8px;border-radius:50%;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{flex:1;overflow-y:auto}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:600;font-size:18px;object-fit:cover}
.sm{width:38px;height:38px;font-size:15px}
.row{display:flex;gap:12px;align-items:center;padding:10px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.row .b{flex:1;min-width:0}
.row .n{font-weight:600}
.row .p{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tm{color:var(--mut);font-size:12px}
nav{display:flex;border-top:1px solid var(--line)}
nav button{flex:1;padding:10px 0;color:var(--mut);font-size:13px}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{color:var(--bar);font-weight:600}
@media (prefers-color-scheme:dark){nav button.on{color:var(--acc)}}
.fab{position:absolute;right:16px;bottom:78px;width:54px;height:54px;border-radius:16px;background:var(--acc);color:#04210f;font-size:24px;box-shadow:0 3px 10px #0004}
.msgs{background:var(--chat);padding:12px;display:flex;flex-direction:column;gap:6px;min-height:100%}
.m{max-width:78%;padding:6px 9px;border-radius:8px;background:var(--them);word-wrap:break-word}
.m.me{align-self:flex-end;background:var(--me)}
.m .s{display:block;font-size:12px;font-weight:600;color:var(--bar)}
.m img{max-width:100%;border-radius:6px;display:block}
.m i{display:block;text-align:right;font-size:11px;color:var(--mut);font-style:normal}
.m.sys{align-self:center;background:transparent;color:var(--mut);font-size:12px;max-width:90%;text-align:center}
.xb{font-size:13px;padding:6px 10px;border:1px solid #fff8;border-radius:14px}
.bar{display:flex;gap:8px;padding:8px;background:var(--chat);align-items:center}
input[type=text],input[type=password]{flex:1;padding:11px 14px;border-radius:22px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;width:100%}
.send{background:var(--bar);color:#fff;width:42px;height:42px;border-radius:50%}
@media (prefers-color-scheme:dark){.send{background:var(--acc);color:#04210f}}
.f{padding:20px;display:flex;flex-direction:column;gap:12px;align-items:center}
.f .av{width:110px;height:110px;font-size:44px}
.pw{display:flex;width:100%;gap:4px;align-items:center}
.btn{background:var(--bar);color:#fff;padding:12px 24px;border-radius:24px;font-weight:600}
@media (prefers-color-scheme:dark){.btn{background:var(--acc);color:#04210f}}
.lbl{align-self:flex-start;color:var(--mut);font-size:13px}
.er{color:#d1584f;align-self:flex-start}
.lnk{color:var(--bar);text-decoration:underline}
@media (prefers-color-scheme:dark){.lnk{color:var(--acc)}}
.ck{display:flex;gap:12px;align-items:center;padding:6px 4px;width:100%}
.ck input{width:20px;height:20px}
.empty{padding:40px 20px;text-align:center;color:var(--mut)}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="fp" accept="image/*" style="position:absolute;left:-9999px;opacity:0" tabindex="-1">
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
import{getFirestore,doc,setDoc,updateDoc,addDoc,collection,onSnapshot,query,where,orderBy,serverTimestamp,getDoc,arrayRemove,runTransaction}from"https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

const fb=initializeApp({apiKey:"AIzaSyAJtEAURxrUMU_Hjc9N3X3k1MMxFwz42-Y",authDomain:"sohbet-6f6b7.firebaseapp.com",projectId:"sohbet-6f6b7",storageBucket:"sohbet-6f6b7.firebasestorage.app",messagingSenderId:"705891559189",appId:"1:705891559189:web:f10a2af993a673f1a6eb1c"});
const A=getAuth(fb),D=getFirestore(fb),R=document.getElementById('app'),fp=document.getElementById('fp');
const cols=['#d1584f','#4a7fb5','#8a6bb5','#d08b2e','#3d9b7a','#b5527f'];
const S={u:null,users:{},chats:[],msgs:[],v:'auth',reg:0,show:0,err:'',tab:0,cid:null,sel:{},f:{u:'',p:'',p2:''},mode:'chat'};
let subs=[],subMsgs=null;

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const img=s=>s&&String(s).startsWith('data:image/')?s:null;
const hm=t=>{const d=t&&t.toDate?t.toDate():new Date();return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')};
const col=s=>cols[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%6];
const av=(name,photo,cls)=>img(photo)?`<img class="av ${cls||''}" src="${img(photo)}" alt="">`:`<div class="av ${cls||''}" style="background:${col(name)}">${esc((name||'?')[0].toUpperCase())}</div>`;
const uOf=id=>S.users[id]||{name:'?'};
const fmtc=c=>c?String(c).replace(/(\d{3})(?=\d)/g,'$1 '):'';
async function claimCode(uid,extra){for(let i=0;i<8;i++){const code=String(Math.floor(1e8+Math.random()*9e8));try{await runTransaction(D,async t=>{const r=doc(D,'codes',code);if((await t.get(r)).exists())throw new Error('dup');t.set(r,{uid});t.set(doc(D,'users',uid),{...extra,code},{merge:true})});return code}catch(e){if(e.message!=='dup')throw e}}}
const other=c=>c.members.find(x=>x!==S.u.uid);
const title=c=>c.group?c.name:uOf(other(c)).name;
const picOf=c=>c.group?c.photo:uOf(other(c)).photo;
const adminOf=c=>c.admin||c.members[0],isAdm=c=>adminOf(c)===S.u.uid;
const sysMsg=(id,text)=>addDoc(collection(D,'chats',id,'messages'),{from:S.u.uid,sys:true,text,t:serverTimestamp()});
const msgErr=c=>({'auth/email-already-in-use':'Bu kullanıcı adı alınmış, başka bir tane dene.','auth/invalid-credential':'Kullanıcı adı veya şifre yanlış.','auth/user-not-found':'Kullanıcı adı veya şifre yanlış.','auth/wrong-password':'Kullanıcı adı veya şifre yanlış.','auth/network-request-failed':'İnternet bağlantısı yok.','auth/operation-not-allowed':'Firebase\'de E-posta/Şifre girişi açık değil.','auth/too-many-requests':'Çok fazla deneme yaptın, biraz bekle.'}[c]||'Bir hata oldu ('+c+').');

function shrink(file,max,q){return new Promise(res=>{const i=new Image(),r=new FileReader();r.onload=()=>{i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};i.src=r.result};r.readAsDataURL(file)})}

const tabs=()=>'<nav>'+[['💬','Sohbetler'],['👥','Gruplar'],['👤','Profil']].map((x,i)=>`<button data-a="tab" data-i="${i}" class="${S.tab===i?'on':''}"><b>${x[0]}</b>${x[1]}</button>`).join('')+'</nav>';
const pwRow=(id,val)=>`<div class="pw"><input type="${S.show?'text':'password'}" id="${id}" value="${esc(val)}" autocomplete="${S.reg?'new-password':'current-password'}">${id==='ap'?`<button class="ib" data-a="eye" aria-label="Şifreyi göster veya gizle">${S.show?'🙈':'👁'}</button>`:''}</div>`;

function render(force){
 if(!force&&S.v!=='chat'&&document.activeElement&&document.activeElement.tagName==='INPUT')return;
 let h='';
 if(S.v==='auth'){
  h=`<header><h1>${S.reg?'Hesap oluştur':'Giriş yap'}</h1></header><main><div class="f"><span class="lbl">Kullanıcı adı</span><input type="text" id="au" maxlength="20" autocapitalize="none" autocomplete="username" value="${esc(S.f.u)}"><span class="lbl">Şifre</span>${pwRow('ap',S.f.p)}${S.reg?`<span class="lbl">Şifre tekrar</span>${pwRow('ap2',S.f.p2)}`:''}${S.err?`<span class="er" role="alert">${esc(S.err)}</span>`:''}<button class="btn" data-a="go">${S.reg?'Kayıt ol':'Giriş yap'}</button><button class="lnk" data-a="sw">${S.reg?'Hesabın var mı? Giriş yap':'Hesabın yok mu? Kayıt ol'}</button></div></main>`;
 }else if(S.v==='main'){
  const me=uOf(S.u.uid);
  if(S.tab===2){
   h=`<header><h1>Profil</h1></header><main><div class="f"><label for="fp" data-m="pp" style="cursor:pointer" aria-label="Profil fotoğrafını değiştir">${av(me.name,me.photo)}</label><span class="lbl">Fotoğrafı değiştirmek için dokun</span><span class="lbl">Adın (herkes bunu görür)</span><input type="text" id="nm" value="${esc(me.name)}" maxlength="30"><button class="btn" data-a="savep">Kaydet</button><span class="lbl">Senin kodun (arkadaşların seni bununla ekler)</span><div class="pw"><input type="text" id="mc" value="${fmtc(me.code)||'Hazırlanıyor...'}" readonly><button class="btn" data-a="cp">Kopyala</button></div><span class="lbl">Kullanıcı adın: ${esc(me.username)}</span><button class="lnk" data-a="out">Çıkış yap</button></div></main>${tabs()}`;
  }else{
   const l=S.chats.filter(c=>S.tab===0||c.group);
   h=`<header><h1>Sohbet</h1></header><main>${l.length?l.map(c=>`<button class="row" data-a="open" data-i="${c.id}">${av(title(c),picOf(c))}<div class="b"><div class="n">${esc(title(c))}</div><div class="p">${c.last?esc((c.group&&c.last.from!==S.u.uid?uOf(c.last.from).name+': ':'')+c.last.text):'Yeni sohbet'}</div></div><span class="tm">${c.last?hm(c.last.t):''}</span></button>`).join(''):'<div class="empty">Henüz sohbet yok. Sağ alttaki ➕ ile arkadaşının kodunu gir.</div>'}</main><button class="fab" data-a="newc" aria-label="Yeni sohbet veya grup">➕</button>${tabs()}`;
  }
 }else if(S.v==='newc'){
  h=`<header><button class="ib" data-a="back" aria-label="Geri">←</button><h1>Kod ile ekle</h1></header><main><div class="f"><span class="lbl">Arkadaşının kodunu yaz. Grup için birden fazla kodu boşlukla ayırarak yaz.</span><input type="text" id="cd" inputmode="numeric" placeholder="123 456 789" autocomplete="off" value="${esc(S.cd||'')}"><input type="text" id="gn" placeholder="Grup adı (birden fazla kod varsa)" maxlength="30" value="${esc(S.gn||'')}">${S.err?`<span class="er" role="alert">${esc(S.err)}</span>`:''}<button class="btn" data-a="mk">Başlat</button><span class="lbl">Senin kodun: ${fmtc(uOf(S.u.uid).code)}</span></div></main>`;
 }else if(S.v==='info'){
  const c=S.chats.find(x=>x.id===S.cid);if(!c){S.v='main';return render(true)}
  const adm=isAdm(c);
  h=`<header><button class="ib" data-a="backc" aria-label="Geri">←</button><h1>Grup bilgisi</h1></header><main><div class="f">${adm?`<label for="fp" data-m="gp" style="cursor:pointer" aria-label="Grup fotoğrafını değiştir">${av(c.name,c.photo)}</label><span class="lbl">Fotoğrafı değiştirmek için dokun</span><input type="text" id="gname" value="${esc(c.name)}" maxlength="30"><button class="btn" data-a="gsave">Adı kaydet</button>`:`${av(c.name,c.photo)}<h2 style="margin:0">${esc(c.name)}</h2>`}<span class="lbl">${c.members.length} üye</span>${c.members.map(id=>{const u=uOf(id);return `<div class="ck">${av(u.name,u.photo,'sm')}<span style="flex:1">${esc(u.name)}${id===S.u.uid?' (sen)':''}${id===adminOf(c)?' <small style="color:var(--mut)">yönetici</small>':''}</span>${adm&&id!==S.u.uid?`<button class="xb" style="border-color:var(--mut)" data-a="kick" data-i="${id}">Çıkar</button>`:''}</div>`}).join('')}<button class="lnk" data-a="leave">Gruptan çık</button></div></main>`;
 }else if(S.v==='chat'){paintChat();return}
 R.innerHTML=h;
}

function openChat(id){
 S.v='chat';S.cid=id;S.msgs=[];S.seenChat=null;
 const c=S.chats.find(x=>x.id===id);
 R.innerHTML=`<header><button class="ib" data-a="back" aria-label="Geri">←</button><span id="hd" style="display:contents"></span><span id="lv" style="display:contents"></span></header><main id="mm"><div class="msgs" id="ms"></div></main><div class="bar"><label class="ib" for="fp" data-m="chat" style="cursor:pointer" aria-label="Fotoğraf gönder">📎</label><input type="text" id="tx" placeholder="Mesaj yaz" aria-label="Mesaj"><button class="send" data-a="send" aria-label="Gönder">➤</button></div>`;
 paintChat();
 if(subMsgs)subMsgs();
 subMsgs=onSnapshot(query(collection(D,'chats',id,'messages'),orderBy('t')),s=>{S.msgs=s.docs.map(d=>d.data());paintChat(true)});
}
function paintChat(scroll){
 if(S.v!=='chat')return;
 const c=S.chats.find(x=>x.id===S.cid);if(!c)return;S.seenChat=S.cid;
 document.getElementById('hd').innerHTML=c.group?`<button data-a="info" aria-label="Grup bilgisi" style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left">${av(title(c),picOf(c),'sm')}<div class="t">${esc(title(c))}</div></button>`:av(title(c),picOf(c),'sm')+`<div class="t">${esc(title(c))}</div>`;
 document.getElementById('lv').innerHTML=c.group?'<button class="xb" data-a="leave">Gruptan çık</button>':'';
 document.getElementById('ms').innerHTML=S.msgs.map(m=>{if(m.sys)return `<div class="m sys">${esc(m.text)}</div>`;const mine=m.from===S.u.uid;return `<div class="m${mine?' me':''}">${c.group&&!mine?`<span class="s">${esc(uOf(m.from).name)}</span>`:''}${img(m.img)?`<img src="${img(m.img)}" alt="Fotoğraf">`:''}${m.text?esc(m.text):''}<i>${hm(m.t)}</i></div>`}).join('');
 if(scroll){const mm=document.getElementById('mm');mm.scrollTop=mm.scrollHeight}
}
async function send(photo){
 const i=document.getElementById('tx'),text=i.value.trim();if(!text&&!photo)return;i.value='';
 try{
  await addDoc(collection(D,'chats',S.cid,'messages'),{from:S.u.uid,text,img:photo||null,t:serverTimestamp()});
  await updateDoc(doc(D,'chats',S.cid),{last:{text:text||'📷 Fotoğraf',from:S.u.uid,t:serverTimestamp()}});
 }catch(e){alert('Mesaj gönderilemedi: '+e.code)}
}
const rdA=()=>{const g=id=>document.getElementById(id);if(g('au'))S.f.u=g('au').value;if(g('ap'))S.f.p=g('ap').value;if(g('ap2'))S.f.p2=g('ap2').value};
const fail=m=>{S.err=m;render(true)};
async function go(){
 rdA();const u=S.f.u.trim().toLowerCase(),p=S.f.p;
 if(!/^[a-z0-9_.]{3,20}$/.test(u))return fail('Kullanıcı adı 3-20 karakter olmalı. Sadece harf (a-z), rakam, _ ve . kullan.');
 if(p.length<6)return fail('Şifre en az 6 karakter olmalı.');
 if(S.reg&&p!==S.f.p2)return fail('Şifreler aynı değil.');
 try{
  if(S.reg){const r=await createUserWithEmailAndPassword(A,u+'@sohbet.app',p);await claimCode(r.user.uid,{username:u,name:u,photo:null})}
  else await signInWithEmailAndPassword(A,u+'@sohbet.app',p);
 }catch(e){fail(msgErr(e.code))}
}
async function mk(){
 const g=id=>document.getElementById(id);S.cd=g('cd').value;S.gn=g('gn').value;
 const dg=S.cd.replace(/\D/g,''),codes=dg.length&&dg.length%9===0?[...new Set(dg.match(/.{9}/g))]:[],n=S.gn.trim();
 if(!dg)return fail('Arkadaşının kodunu yaz.');
 if(!codes.length)return fail('Kod 9 haneli olmalı (örnek: 123 456 789). Kaç hane yazdığını kontrol et.');
 try{
  const ids=[];
  for(const c of codes){const q=await getDoc(doc(D,'codes',c));if(!q.exists())return fail(fmtc(c)+' kodlu kimse bulunamadı.');if(q.data().uid===S.u.uid)return fail('Kendi kodunu yazdın.');ids.push(q.data().uid)}
  if(ids.length===1){const id=[S.u.uid,ids[0]].sort().join('_');await setDoc(doc(D,'chats',id),{members:[S.u.uid,ids[0]],group:false},{merge:true});S.cd='';S.gn='';openChat(id)}
  else{if(!n)return fail('Grup için bir ad yaz.');const r=await addDoc(collection(D,'chats'),{members:[S.u.uid,...ids],group:true,name:n,admin:S.u.uid,photo:null});S.cd='';S.gn='';openChat(r.id)}
 }catch(e){fail('Oluşturulamadı: '+e.code)}
}
fp.onchange=async()=>{
 const f=fp.files[0];if(!f)return;fp.value='';
 if(S.mode==='pp'){const d=await shrink(f,200,.7);await updateDoc(doc(D,'users',S.u.uid),{photo:d})}
 else if(S.mode==='gp'){const c=S.chats.find(x=>x.id===S.cid);if(c&&isAdm(c)){const d=await shrink(f,200,.7);await updateDoc(doc(D,'chats',S.cid),{photo:d});sysMsg(S.cid,uOf(S.u.uid).name+' grup fotoğrafını değiştirdi')}}
 else send(await shrink(f,700,.65));
};
document.addEventListener('click',e=>{const l=e.target.closest&&e.target.closest('[data-m]');if(l)S.mode=l.dataset.m});

R.addEventListener('click',async e=>{
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a==='eye'){rdA();S.show=!S.show;render(true)}
 else if(a==='sw'){rdA();S.reg=!S.reg;S.err='';render(true)}
 else if(a==='go')go();
 else if(a==='tab'){S.tab=+b.dataset.i;render(true)}
 else if(a==='open')openChat(b.dataset.i);
 else if(a==='back'){if(subMsgs){subMsgs();subMsgs=null}S.v='main';S.err='';render(true)}
 else if(a==='newc'){S.v='newc';S.sel={};S.err='';render(true)}
 else if(a==='mk')mk();
 else if(a==='send')send();
 else if(a==='savep'){const n=document.getElementById('nm').value.trim()||uOf(S.u.uid).username;await updateDoc(doc(D,'users',S.u.uid),{name:n});b.textContent='Kaydedildi'}
 else if(a==='leave'){if(!confirm('Gruptan çıkmak istediğine emin misin?'))return;const id=S.cid,nm=uOf(S.u.uid).name,c=S.chats.find(x=>x.id===id),rest=c.members.filter(x=>x!==S.u.uid);try{await addDoc(collection(D,'chats',id,'messages'),{from:S.u.uid,sys:true,text:nm+' gruptan çıktı',t:serverTimestamp()});await updateDoc(doc(D,'chats',id),{members:arrayRemove(S.u.uid),...(isAdm(c)?{admin:rest[0]||null}:{}),last:{text:nm+' gruptan çıktı',from:S.u.uid,t:serverTimestamp()}})}catch(e){alert('Çıkılamadı: '+e.code);return}if(subMsgs){subMsgs();subMsgs=null}S.v='main';render(true)}
 else if(a==='cp'){try{await navigator.clipboard.writeText(uOf(S.u.uid).code);b.textContent='Kopyalandı'}catch(e){b.textContent='Kodu elle kopyala'}}
 else if(a==='info'){S.v='info';render(true)}
 else if(a==='backc')openChat(S.cid);
 else if(a==='gsave'){const c=S.chats.find(x=>x.id===S.cid),n=document.getElementById('gname').value.trim();if(!c||!isAdm(c)||!n)return;try{await updateDoc(doc(D,'chats',S.cid),{name:n});if(n!==c.name)await sysMsg(S.cid,uOf(S.u.uid).name+' grup adını "'+n+'" yaptı');b.textContent='Kaydedildi'}catch(e){alert('Kaydedilemedi: '+e.code)}}
 else if(a==='kick'){const c=S.chats.find(x=>x.id===S.cid),id=b.dataset.i;if(!c||!isAdm(c)||id===S.u.uid)return;if(!confirm(uOf(id).name+' gruptan çıkarılsın mı?'))return;try{await updateDoc(doc(D,'chats',S.cid),{members:arrayRemove(id)});await sysMsg(S.cid,uOf(id).name+' gruptan çıkarıldı')}catch(e){alert('Çıkarılamadı: '+e.code)}}
 else if(a==='out')signOut(A);
});
R.addEventListener('change',e=>{if(e.target.type==='checkbox')S.sel[e.target.dataset.i]=e.target.checked});
R.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(e.target.id==='tx')send();else if(S.v==='auth')go()});

onAuthStateChanged(A,u=>{
 subs.forEach(f=>f());subs=[];if(subMsgs){subMsgs();subMsgs=null}
 if(!u){S.u=null;S.v='auth';S.f={u:'',p:'',p2:''};render(true);return}
 S.u=u;S.v='main';S.tab=0;S.err='';
 subs.push(onSnapshot(collection(D,'users'),s=>{S.users={};s.forEach(d=>S.users[d.id]=d.data());const mm=S.users[u.uid];if(mm&&!mm.code&&!S.coding){S.coding=1;claimCode(u.uid,{}).catch(()=>{}).finally(()=>{S.coding=0})}render()}));
 subs.push(onSnapshot(query(collection(D,'chats'),where('members','array-contains',u.uid)),s=>{
  S.chats=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>((b.last&&b.last.t&&b.last.t.seconds)||0)-((a.last&&a.last.t&&a.last.t.seconds)||0));if((S.v==='chat'||S.v==='info')&&S.seenChat===S.cid&&!S.chats.some(x=>x.id===S.cid)){if(subMsgs){subMsgs();subMsgs=null}S.v='main';alert('Bu gruptan çıkarıldın.');render(true);return}render()}));
 render(true);
});
render(true);
